<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFF8EE">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぷにぷに">
<title>ぷにぷに にっき</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
<script type="module" src="./js/app.js"></script>
</head>
<body>
<header class="top">
  <div class="title"><b id="petName"></b><small id="genLabel"></small></div>
  <div class="topbtns">
    <span class="coin" id="coin" role="status"></span>
    <button class="pill" id="zukanBtn">📚 ずかん</button>
    <button class="pill" id="oheyaBtn">🏠 おへや</button>
    <button class="gear" id="gear" aria-label="おうちの方の設定（長押し）">⚙️</button>
  </div>
</header>

<main class="layout">
  <section class="maincol">
    <div class="frame">
      <div class="screen" id="screen">
        <div class="scene" id="scene"></div>
        <div class="gauges" id="gauges"></div>
        <div class="badges" id="badges"></div>
        <button class="pet" id="pet" aria-label="なでる"></button>
        <div class="growth" id="growth"></div>
      </div>
    </div>
    <div class="bubble" aria-live="polite">
      <p id="bubbleText"></p>
      <p id="bubbleZh" class="zh"></p>
      <button class="speak" id="speakBtn" aria-label="よみあげ">🔊</button>
    </div>
    <div class="tray" id="tray"></div>
  </section>

  <section class="sidecol">
    <div class="note">
      <h2>できたこと を おしえてね</h2>
      <div class="tasks" id="tasks"></div>
    </div>
    <div class="note pnote">
      <h2>つよさ</h2>
      <div class="params" id="params"></div>
    </div>
  </section>
</main>

<div class="roomview" id="roomView" hidden>
  <div class="rtop">
    <button class="pill" id="roomBack">← もどる</button>
    <b class="rname" id="roomName"></b>
    <span class="coin" id="roomCoin" role="status"></span>
    <button class="pill" id="shopBtn">🛒 おみせ</button>
    <button class="pill" id="editBtn">🛠 もようがえ</button>
    <button class="pill" id="editDone" hidden>おわり</button>
  </div>
  <div class="rstage" id="roomStage">
    <div class="rscene" id="roomScene"></div>
    <button class="rpet" id="roomPet" aria-label="なでる"></button>
  </div>
  <div class="bubble rbubble" aria-live="polite">
    <p id="roomBubbleText"></p>
    <p id="roomBubbleZh" class="zh"></p>
    <button class="speak" id="roomSpeakBtn" aria-label="よみあげ">🔊</button>
  </div>
  <div class="rtray" id="roomTray" hidden>
    <div class="ttabs">
      <button class="ttab" data-tab="kagu">かぐ</button>
      <button class="ttab" data-tab="yuka">ゆか</button>
      <button class="ttab" data-tab="kabe">かべ</button>
    </div>
    <div class="tlist" id="trayList"></div>
    <div class="tacts">
      <button class="pill" id="trayRotate">まわす</button>
      <button class="pill" id="trayStore">しまう</button>
    </div>
  </div>
  <div class="rshop" id="roomShop" hidden>
    <div class="shead">
      <h2>おみせ</h2>
      <span class="coin" id="shopCoin" role="status"></span>
      <button class="pill" id="shopClose">とじる</button>
    </div>
    <div class="stabs">
      <button class="stab" data-cat="kagu">かぐ</button>
      <button class="stab" data-cat="yuka">ゆか</button>
      <button class="stab" data-cat="kabe">かべ</button>
      <button class="stab" data-cat="hiroge">ひろげる</button>
    </div>
    <div class="scards" id="shopCards"></div>
    <div class="sconfirm" id="shopConfirm" hidden>
      <div class="sconfirm-art" id="shopConfirmArt"></div>
      <p class="sconfirm-name" id="shopConfirmName"></p>
      <p class="sconfirm-price" id="shopConfirmPrice"></p>
      <div class="btns">
        <button class="btn" id="shopBuy">かう</button>
        <button class="btn ghost" id="shopCancel">やめる</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

</body>
</html>
